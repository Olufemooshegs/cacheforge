name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Lint with Ruff
      run: |
        ruff check .
        ruff format --check .
        
    - name: Run Unit Tests
      # We skip integration tests here because GitHub Actions runners
      # don't have the Docker Compose stack running by default.
      # Our conftest.py auto-skips them if services are unreachable,
      # but we explicitly target the unit folder to be safe and fast.
      run: |
        python -m pytest tests/unit -q